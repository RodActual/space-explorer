<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#03040c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Deep Space Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header>
    <h1>Deep Space Explorer</h1>
    <p>Pick a body to learn about it.</p>
    <a class="cta" href="simulation.html">Open the orbital simulation</a>
  </header>

  <main>
    <nav id="bodies" aria-label="Solar system bodies"></nav>

    <section id="info" aria-live="polite">
      <h2 id="name"></h2>
      <p id="desc"></p>
      <dl>
        <dt>Diameter</dt><dd id="diameter"></dd>
        <dt>Distance from Sun</dt><dd id="distance"></dd>
        <dt>Known moons</dt><dd id="moons"></dd>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
